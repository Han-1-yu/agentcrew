name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint-and-test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 工具链钉版本：不钉的话"今天绿、明天红"，红的原因与自己改的代码无关。
          # 升级这两个版本时必须先在本机跑通 ruff check . 与 mypy agentcrew/。
          pip install "ruff==0.17.3" "mypy==2.4.1"

      - name: ruff
        run: ruff check .

      # 只检查库代码：tests/ 里大量 fixture 用动态属性（如 server._server.sockets），
      # 为它们加类型标注的收益远低于噪声。库代码当前是零错误基线。
      - name: mypy
        run: mypy agentcrew/

      - name: pytest
        run: pytest -q
        env:
          # 测试使用 mock provider，不需要任何 API key。
          # conftest.py 的 autouse 夹具会中和 .env 对测试的影响。
          AGENTCREW_MOCK: "true"
