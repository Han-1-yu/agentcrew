name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint-and-test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 工具链钉版本：不钉的话"今天绿、明天红"，红的原因与自己改的代码无关。
          # 升级这两个版本时必须先在本机跑通 ruff check . 与 mypy agentcrew/。
          pip install "ruff==0.17.3" "mypy==2.4.1" "pytest-cov>=7.0.0"

      - name: ruff
        run: ruff check .

      # 只检查库代码：tests/ 里大量 fixture 用动态属性（如 server._server.sockets），
      # 为它们加类型标注的收益远低于噪声。库代码当前是零错误基线。
      - name: mypy
        run: mypy agentcrew/

      # D-10：覆盖率地板线。门槛是「不得倒退」的下限（当前实测约 60%），
      # 不是目标值；只在 Linux 单进程跑（Windows 裸 pytest 会随机崩溃，
      # 那里的 job 用 scripts/test.py 且不开覆盖率）。
      - name: pytest (coverage gate)
        run: pytest -q --cov=agentcrew --cov-report=term --cov-fail-under=50
        env:
          # 测试使用 mock provider，不需要任何 API key。
          # conftest.py 的 autouse 夹具会中和 .env 对测试的影响。
          AGENTCREW_MOCK: "true"

  # 本项目的开发与排障都在 Windows 上进行。Windows 下跑大型测试会出现随机进程级
  # 崩溃（access violation / segfault / 坏 .pyc 的 SystemError），这是环境问题不是
  # 回归——所以这条 job 不用裸 ``pytest -q``，而用 `scripts/test.py` 崩溃隔离跑器
  # （逐批 + 崩溃自动重试 + 汇总），与本机同一条路径；同时用 uv + uv.lock 验证
  # 「锁文件可复现」。
  windows:
    name: "Windows · Python 3.12 (uv)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Install (uv sync)
        run: uv sync --all-groups

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run python scripts/test.py
        env:
          AGENTCREW_MOCK: "true"

  # C2 的 docker 后端此前只有「命令行参数拼得对」的纯函数单测——那答不出
  # 「这些参数真进容器后是否真的隔离」。真隔离需要一台有 docker 的机器，
  # 开发机与云主机都起不来容器（unshare: operation not permitted），于是把
  # runner 当那台机器：真拉镜像、真起容器、真跑四条逃逸用例。
  # 用例见 tests/test_docker_isolation_live.py（无开关默认 skip，避免假绿）。
  sandbox-docker:
    name: "Sandbox · docker 真隔离"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull sandbox image
        run: docker pull python:3.12-slim

      - name: 真容器隔离用例（禁网 / 宿主不可见 / 非 root / 资源上限）
        run: AGENTCREW_DOCKER_LIVE=1 pytest -q tests/test_docker_isolation_live.py
        env:
          AGENTCREW_MOCK: "true"

  # D-8：Studio（Electron 前端）此前完全没有 CI——架构分层、模块体量、单元测试
  # 只能靠人记得在本地跑。这里补一个纯 Node job（不启动 Electron：CI 无显示服务）。
  studio:
    name: "Studio · Node 20"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install
        run: npm ci

      - name: 架构分层检查（分层/导入/体量/入口）
        run: npm run check

      - name: 单元测试
        run: npm run test:unit
