# AgentCrew 多模态输入示例：智谱 GLM-4.5V
#
# 用法（key 只放 .env / 环境变量，不写进本文件）：
#   ZHIPU_API_KEY=... \
#   AGENTCREW_CONFIG=examples/agentcrew.vision.example.yaml \
#   AGENTCREW_DEFAULT_MODEL=zhipu:glm-4.5v \
#   python main.py run --goal "根据截图修改登录页" --image login.png --auto
#
# 注意：AGENTCREW_DEFAULT_MODEL 的优先级高于 YAML 的 models.default。
# 如果 .env 里已经设了 deepseek 等其他默认模型，运行时需像上面一样显式覆盖，
# 否则会走纯文本模型并记录 vision_unsupported（图片不会静默冒充已读）。
models:
  default: zhipu:glm-4.5v
  providers:
    zhipu:
      # glm-4v-flash 实测 max_tokens 仅允许 [1, 1024]；GLM-4.5V 用 4096
      # 可覆盖单个 HTML 产物，且给 reasoning tokens 留出空间。
      max_output_tokens: 4096
      capabilities:
        # 默认关；只有明确选择视觉模型时才打开。不要把该能力位用于
        # glm-4-flash 等纯文本模型。
        supports_vision: true
