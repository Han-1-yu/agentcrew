[project]
name = "agentcrew"
version = "1.0.0"
description = "多智能体协作平台：项目经理调度 8 个专职 Agent 完成从需求到交付的全流程"
requires-python = ">=3.10"   # 与设计规格 §1 的目标运行时一致
# 与 requirements.txt 保持同一份清单：pip 路径读 requirements.txt，uv 路径读这里。
# 改依赖必须两处同步改（CI 会分别用 pip 与 uv 各跑一遍，不一致立刻红）。
dependencies = [
    "openai>=1.40.0",        # 同时用于 OpenAI 兼容端点（豆包/通义/DeepSeek/Ollama）
    "anthropic>=0.34.0",     # Anthropic 原生 Messages API
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── 静态检查起步配置（spec §17.5）────────────────────────────────────────
# 宽松起步：用来在本地先挡住明显问题，不作为提交闸门。需要更严的规则时按需加，
# 不要一次性打开全部规则集。

[tool.ruff]
line-length = 100
target-version = "py310"  # spec 声明的运行下界就是 3.10；定高了会放过 3.11+ 语法
extend-exclude = ["examples/fixtures", "output", ".venv"]

[tool.ruff.lint]
# R-A 收口：在起步集之上加 SIM（可简化写法）/ RET（返回路径）/ PERF（常见低效）。
# 刻意不引入 TRY：TRY003（异常带长文案）与 TRY004（类型错误抛 ValueError）是
# 项目约定——中文直白报错文案 + 配置错误统一收口为 ValueError（见 config.py
# `_yaml_values` 的注释），迁移它们只会制造噪音，不是缺陷。
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "PERF"]
# E501：行长由 formatter / 评审把关，起步阶段不设硬线。
# PERF203：循环内 try/except 在 py3.11+ 才是零成本；本项目运行下界 3.10，
# 且这些循环多为「逐条容错」语义，为消规则而重构会改变容错边界，不值。
ignore = ["E501", "PERF203"]

# ── 覆盖率（P1「覆盖率基线 + 门槛」）────────────────────────────────────
# 只测 agentcrew 本体；报告在 `scripts/test.py --coverage` 里 combine 后统一出。
[tool.coverage.run]
source = ["agentcrew"]

[tool.coverage.report]
precision = 1
# D-10：覆盖率地板线。当前全量实测约 60%（Windows 本地受 pytest 插件加载抖动
# 与沙箱拦截影响，取不到稳定值，门槛在 CI 的 Linux 单进程 job 生效）。
# 这是「不得倒退」的下限，不是目标值；提升覆盖率后再往上调。
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AssertionError",
    "@abstractmethod",
    "@overload",
    "def __repr__",
]

[tool.mypy]
python_version = "3.10"  # 与 ruff target-version 同一口径：检查声明的最低版本
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
