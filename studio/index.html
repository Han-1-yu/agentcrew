<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>AgentCrew Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <header id="topbar">
    <div class="brand">
      <svg class="brand-mark" width="20" height="20" viewBox="0 0 18 18" aria-hidden="true">
        <rect x="1"  y="1"  width="7" height="7" rx="1.5"/>
        <rect x="10" y="1"  width="7" height="7" rx="1.5" opacity=".55"/>
        <rect x="1"  y="10" width="7" height="7" rx="1.5" opacity=".55"/>
        <rect x="10" y="10" width="7" height="7" rx="1.5"/>
      </svg>
      <span class="brand-name">AgentCrew&nbsp;<em>Studio</em></span>
    </div>
    <div class="top-actions">
      <button id="btn-new-run" class="btn btn-primary" type="button">
        <span class="btn-plus">+</span> 新运行
      </button>
      <button id="btn-refresh-runs" class="btn btn-icon" type="button" title="刷新" aria-label="刷新">⟳</button>
    </div>
  </header>

  <div id="layout">
    <!-- 左侧图标导航栏 -->
    <nav id="icon-rail">
      <button class="rail-item active" data-view="runs" title="运行列表" aria-label="运行列表">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </button>
      <button class="rail-item" data-view="settings" title="设置" aria-label="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-item" id="btn-theme" title="切换主题" aria-label="切换主题">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </nav>

    <!-- 主内容区 -->
    <main id="main" tabindex="-1">
      <!-- 运行列表视图（卡片式） -->
      <section id="runs-view">
        <div class="runs-header">
          <div class="runs-title-group">
            <h1 class="runs-title">运行</h1>
            <span id="runs-count" class="runs-count-badge"></span>
          </div>
          <div class="runs-toolbar">
            <div class="runs-search">
              <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input id="run-search" type="search" placeholder="搜索目标或 run id" autocomplete="off">
            </div>
          </div>
        </div>
        <div id="run-cards" class="run-cards"></div>
      </section>

      <!-- 运行详情视图 -->
      <section id="run-view" class="hidden"></section>

      <!-- 空态 -->
      <section id="empty-view" class="hidden">
        <div class="empty-inner">
          <div class="empty-glyph">
            <svg width="48" height="48" viewBox="0 0 18 18" aria-hidden="true">
              <rect x="1" y="1" width="7" height="7" rx="1.5"/>
              <rect x="10" y="1" width="7" height="7" rx="1.5" opacity=".5"/>
              <rect x="1" y="10" width="7" height="7" rx="1.5" opacity=".5"/>
              <rect x="10" y="10" width="7" height="7" rx="1.5"/>
            </svg>
          </div>
          <h1>多智能体协作的驾驶舱</h1>
          <p>从运行列表选择一次运行，查看任务看板、事件流与产物；或启动一次新运行。</p>
          <div class="empty-actions">
            <button id="btn-empty-new" class="btn btn-primary" type="button">
              <span class="btn-plus">+</span> 新运行
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- 任务详情 / 产物预览 抽屉 -->
<div id="drawer-mask" class="drawer-mask hidden"></div>
<aside id="drawer" class="hidden" role="dialog" aria-modal="true"></aside>

<!-- 模态（新运行 / 设置 / 结束报告） -->
<div id="modal-mask" class="hidden"></div>
<div id="modal" class="hidden" role="dialog" aria-modal="true"></div>

<div id="toasts" aria-live="polite"></div>

<script src="renderer.js"></script>
</body>
</html>
